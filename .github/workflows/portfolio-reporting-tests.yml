name: Portfolio reporting tests
on:
  push:
    branches: [feature/weekly-portfolio-report]
  pull_request:
    paths:
      - 'portfolio_reporting.py'
      - 'trading_script.py'
      - 'tests/**'
      - '.github/workflows/portfolio-reporting-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install numpy pandas
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile trading_script.py portfolio_reporting.py
